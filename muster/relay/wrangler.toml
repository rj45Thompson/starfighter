name = "muster-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# Comma-separated. Only these origins may call the relay. Add your own if you
# host Muster somewhere else too.
ALLOWED_ORIGINS = "https://rj45thompson.github.io"

# Model and cost dials. Changing these needs no code edit.
#   claude-opus-5   $5/$25 per Mtok   best answers
#   claude-sonnet-5 $2/$10 per Mtok   ~2.5x cheaper, still strong for this
MODEL      = "claude-opus-5"
EFFORT     = "low"       # low/medium/high/xhigh/max — chat rarely needs above low
MAX_TOKENS = "1200"

# Per-IP throttle. On by default, no binding needed. It counts in one isolate's
# memory, so it stops a single machine looping and not a distributed attacker -
# a speed bump, not a quota. The quota is the spend limit on the Anthropic
# workspace, which is the guard that cannot be argued with.
RATE_MAX      = "20"   # requests per IP per window
RATE_WINDOW_S = "60"

# Where unusual activity gets reported. Any URL that accepts a JSON POST: a
# webhook-to-email service, Slack, Discord, your own endpoint. Leave it unset
# and the detectors simply stay quiet. See "The unusual activity zoo" in the
# README for what gets reported and what each one means.
# ALERT_WEBHOOK   = "https://..."
ALERT_COOLDOWN_S = "900"   # at most one message per species per 15 minutes

# The access code is NOT here either - same reason. Set it as a secret and the
# relay refuses any request without it, whatever anyone does to the page:
#     wrangler secret put ACCESS_CODE
# Leave it unset and the relay serves the allowed origins with no code.

# The API key is NOT here. Set it as a secret so it never enters this file
# or your git history:
#     wrangler secret put ANTHROPIC_API_KEY
