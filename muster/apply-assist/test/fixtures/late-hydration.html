<!doctype html>
<meta charset="utf-8">
<title>Careers — hydration fixture</title>
<!-- Greenhouse and Workday render an empty shell and fill it in from JS a
     moment later. A Fill pressed in that gap finds nothing at all. -->
<div id="stage"><p>Loading…</p></div>
<script>
  setTimeout(() => {
    document.getElementById("stage").innerHTML = `
      <form>
        <h2>Apply for this job</h2>
        <label for="fn">First Name</label><input id="fn" name="first_name">
        <label for="em">Email</label><input id="em" name="email" type="email">
        <button type="submit">Submit Application</button>
      </form>`;
  }, 700);
</script>
