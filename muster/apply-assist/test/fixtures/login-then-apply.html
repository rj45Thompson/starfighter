<!doctype html>
<meta charset="utf-8">
<title>Careers — fixture</title>
<!-- A page shaped like the real thing: a sign-in wall, and behind it the
     application form. Used by test/login.test.js to prove the extension waits
     rather than typing into the login box. -->
<div id="stage">
  <form id="signin">
    <h2>Sign in to apply</h2>
    <label for="u">Email</label>
    <input id="u" name="email" type="email" autocomplete="username">
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password">
    <button type="button" id="go">Sign In</button>
  </form>
</div>
<script>
  // "Signing in" swaps the wall for the application, the way an SPA would.
  document.getElementById("go").onclick = () => {
    document.getElementById("stage").innerHTML = `
      <form id="apply">
        <h2>Apply for this job</h2>
        <label for="fn">First Name</label><input id="fn" name="first_name">
        <label for="ln">Last Name</label><input id="ln" name="last_name">
        <label for="em">Email</label><input id="em" name="email" type="email">
        <label for="ph">Phone</label><input id="ph" name="phone_number" type="tel">
        <label for="li">LinkedIn Profile</label><input id="li" name="linkedin">
        <button type="submit">Submit Application</button>
      </form>`;
  };
</script>
