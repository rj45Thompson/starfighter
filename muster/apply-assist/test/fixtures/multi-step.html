<!doctype html>
<meta charset="utf-8">
<title>Careers — multi-step fixture</title>
<!-- Workday splits an application over several steps. Each Next swaps the form
     for new fields that also want filling, without a page load. -->
<div id="stage">
  <form>
    <h2>Apply for this job</h2>
    <label for="fn">First Name</label><input id="fn" name="first_name">
    <label for="ln">Last Name</label><input id="ln" name="last_name">
    <button type="button" id="next">Next</button>
  </form>
</div>
<script>
  document.getElementById("next").onclick = () => {
    document.getElementById("stage").innerHTML = `
      <form>
        <h2>How to reach you</h2>
        <label for="em">Email</label><input id="em" name="email" type="email">
        <label for="ph">Phone</label><input id="ph" name="phone_number" type="tel">
        <label for="li">LinkedIn Profile</label><input id="li" name="linkedin">
        <button type="submit">Submit Application</button>
      </form>`;
  };
</script>
