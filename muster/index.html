<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A workspace for running a job search: your profile, your resume, what you have sent, and an assistant that drafts the awkward parts.">
<meta name="color-scheme" content="light dark">
<title>Muster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FBFAF7; --card:#FFFFFF; --sunk:#F3F1EC;
  --ink:#1C1B18; --soft:#5A574F; --faint:#8C887E;
  --line:#E5E1D8; --line-soft:#F0EDE6;
  --brick:#A8442A; --brick-soft:#F7E7E1;
  --moss:#2A6F5F; --moss-soft:#E2F0EB;
  --amber:#8A6410; --amber-soft:#F8EFD8;
  --display:'Newsreader',Georgia,serif;
  --sans:'Work Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --rail:210px; --chat:370px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141311; --card:#1C1B18; --sunk:#232220;
    --ink:#EDEAE3; --soft:#A9A499; --faint:#7A756B;
    --line:#2E2C27; --line-soft:#232220;
    --brick:#E08A6E; --brick-soft:#331C15;
    --moss:#6FBFA6; --moss-soft:#122A24;
    --amber:#D6A544; --amber-soft:#2E2412;
  }
}
:root[data-theme="dark"]{
  --paper:#141311; --card:#1C1B18; --sunk:#232220;
  --ink:#EDEAE3; --soft:#A9A499; --faint:#7A756B;
  --line:#2E2C27; --line-soft:#232220;
  --brick:#E08A6E; --brick-soft:#331C15;
  --moss:#6FBFA6; --moss-soft:#122A24;
  --amber:#D6A544; --amber-soft:#2E2412;
}
*,*::before,*::after{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px;border-radius:4px}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--chat);min-height:100vh}
.shell.chat-hidden{grid-template-columns:var(--rail) minmax(0,1fr) 0}
.shell.chat-hidden .chatpane{display:none}

.rail{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:2px;padding:18px 11px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:0 7px 15px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brick);display:grid;place-items:center;flex:none;
  font-family:var(--display);font-size:16px;font-weight:600;color:#FFF8F5}
.brand b{font-family:var(--display);font-size:17px;font-weight:600;display:block;line-height:1.15;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.navbtn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:8px 9px;border-radius:8px;color:var(--soft);cursor:pointer}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="true"]{background:var(--brick-soft);color:var(--brick);font-weight:600}
.navbtn .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;opacity:.7}
.railfoot{margin-top:auto;padding-top:13px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:7px}
.status{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--faint);padding:0 7px}
.beacon{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.beacon.on{background:var(--moss);box-shadow:0 0 0 3px var(--moss-soft)}
.beacon.off{background:var(--amber)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:baseline;gap:12px;padding:22px 28px 0;flex-wrap:wrap}
.topbar h1{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
.topbar .sub{color:var(--soft);font-size:13.5px}
.push{margin-left:auto}
.wrap{padding:16px 28px 44px;max-width:880px}

.btn{border:0;border-radius:8px;padding:8px 15px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--brick);color:#FFF8F5}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--soft);font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--faint)}
.btn.small{padding:5px 11px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:default}

.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;margin:0 0 13px}
.card h3{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 7px}
.card p{margin:0 0 9px;color:var(--soft)}
.card p:last-child{margin:0}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}

.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.stat .n{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-top:2px}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.fields .full{grid-column:1/-1}
label.lbl{display:block;font-size:12.5px;color:var(--soft);margin-bottom:4px}
input[type=text],input[type=email],input[type=tel],input[type=url],input[type=password],textarea,select{
  width:100%;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:14px}
textarea{resize:vertical;min-height:88px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brick)}
.hint{font-size:12px;color:var(--faint);margin:4px 0 0}

.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px;text-align:center;background:var(--sunk);cursor:pointer}
.drop:hover{border-color:var(--brick)}
.drop.has{border-style:solid;border-color:var(--moss);background:var(--moss-soft)}
.drop .big{font-family:var(--display);font-size:15px;font-weight:600}
.drop .sm{font-size:12.5px;color:var(--soft);margin-top:3px}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:11px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.sent{background:var(--sunk);color:var(--soft)}
.pill.replied{background:var(--moss-soft);color:var(--moss)}
.pill.interview{background:var(--brick-soft);color:var(--brick)}
.pill.rejected{background:var(--sunk);color:var(--faint)}
.empty{color:var(--faint);font-size:13.5px;padding:16px 10px;text-align:center}

pre.code{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:11px 13px;
  font-family:var(--mono);font-size:11.5px;overflow-x:auto;margin:9px 0 0;max-height:190px;white-space:pre-wrap;word-break:break-all}

/* On the dashboard the chat is not a sidebar, it is the page. Same element,
 * moved rather than duplicated - two chat boxes with two histories would be a
 * worse bug than no chat at all. */
.chatpane.inline{border-left:0;border:1px solid var(--line);border-radius:13px;
  position:static;height:auto;min-height:min(64vh,560px);max-height:none;
  margin:0 0 18px;box-shadow:none}
.chatpane.inline .log{min-height:200px}
.shell.dash-chat{grid-template-columns:var(--rail) minmax(0,1fr) 0}
.shell.dash-chat .fab{display:none}
.askline{font-family:var(--display);font-size:20px;font-weight:600;margin:2px 0 10px;
  letter-spacing:-.01em}
.chatpane{border-left:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.chathead{display:flex;align-items:center;gap:8px;padding:14px 15px;border-bottom:1px solid var(--line-soft)}
.chathead b{font-family:var(--display);font-size:15px;font-weight:600;flex:1}
.log{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:13px}
.msg .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.msg .body{white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me .body{background:var(--sunk);border-radius:10px;padding:9px 12px}
.msg.err .body{background:var(--brick-soft);color:var(--brick);border-radius:10px;padding:9px 12px;font-size:13.5px}
.msg.think .body{color:var(--faint);font-style:italic}
.composer{border-top:1px solid var(--line-soft);padding:10px 11px;display:flex;gap:7px;align-items:flex-end}
.composer textarea{flex:1;min-height:38px;max-height:150px;background:var(--sunk);border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 15px 11px}
.chip{background:var(--sunk);border:1px solid var(--line-soft);border-radius:99px;padding:5px 11px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--brick);color:var(--brick)}
.clip{width:34px;height:34px;flex:none;border:1px solid var(--line);background:var(--sunk);
  border-radius:9px;font-size:19px;line-height:1;color:var(--soft);cursor:pointer}
.clip:hover{border-color:var(--brick);color:var(--brick)}
.clip[disabled]{opacity:.45;cursor:default}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:0 11px 8px}
.file{display:flex;align-items:center;gap:6px;background:var(--sunk);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;font-size:12px;max-width:100%}
.file b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.file span{color:var(--faint);font-family:var(--mono);font-size:10.5px}
.file button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:14px;line-height:1;padding:0 2px}
.file button:hover{color:var(--brick)}
.file.bad{border-color:var(--brick);color:var(--brick)}


.fab{display:none;position:fixed;right:15px;bottom:15px;z-index:20;background:var(--brick);color:#FFF8F5;border:0;border-radius:99px;padding:12px 18px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.22);cursor:pointer}
@media (max-width:1060px){
  .shell,.shell.chat-hidden{grid-template-columns:var(--rail) minmax(0,1fr)}
  .chatpane{position:fixed;inset:auto 0 0 0;height:78vh;z-index:30;border-left:0;border-top:1px solid var(--line);border-radius:13px 13px 0 0;display:none;box-shadow:0 -8px 34px rgba(0,0,0,.2)}
  .shell.chat-open .chatpane{display:flex}
  .chatpane.inline{position:static;inset:auto;height:auto;display:flex;
    border-radius:13px;border:1px solid var(--line);z-index:auto}
  .fab{display:block}
}
@media (max-width:720px){
  .shell,.shell.chat-hidden{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0}
  .railfoot{margin:0 0 0 auto;padding:0;border:0;flex-direction:row}
  .navbtn{width:auto}
  .topbar,.wrap{padding-left:16px;padding-right:16px}
}
</style>

</head>
<body>
<div class="shell" id="shell">
  <aside class="rail">
    <div class="brand">
      <div class="mark">M</div>
      <div><b>Muster</b><span>job engine</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="railfoot">
      <div class="status"><span class="beacon" id="beacon"></span><span id="statusText">starting…</span></div>
      <button class="btn ghost small" id="theme">Theme</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="ptitle">…</h1>
      <div class="sub" id="psub"></div>
      <button class="btn ghost small push" id="chatToggle">Hide chat</button>
    </div>
    <div class="wrap" id="panel"></div>
  </main>

  <aside class="chatpane" id="chatpane">
    <div class="chathead">
      <span class="beacon" id="beacon2"></span>
      <b>Assistant</b>
      <button class="btn ghost small" id="chatClear">Clear</button>
    </div>
    <div class="log" id="log"></div>
    <div class="chips" id="chips"></div>
    <div class="files" id="files"></div>
    <div class="composer">
      <button class="clip" id="clip" title="Attach a file" aria-label="Attach a file">+</button>
      <input type="file" id="pick" multiple hidden
             accept=".txt,.md,.csv,.json,.pdf,image/png,image/jpeg,image/webp">
      <textarea id="input" rows="1" placeholder="Ask, or paste a job posting…"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
  </aside>
</div>
<button class="fab" id="fab">Chat</button>

<script>
/* ------------------------------------------------------------------
   Muster — a job engine you host, paired with the Apply Assist
   extension that does the filling on the job site itself.

   Everything lives in this browser's localStorage. Nothing is sent
   anywhere except the questions you put to the assistant.
   ------------------------------------------------------------------ */

const $ = (s) => document.querySelector(s);

/* The access code is not this page's business. It arrives in the link, it is
 * kept so a reload does not lose it, and it is handed to the desk with every
 * question. The desk is what checks it - it is the thing with something to
 * protect. A verifier here only ever told somebody their typing was wrong on a
 * screen that no longer exists. */

/* ---------- telling the owner someone is here ----------
 *
 * A static page cannot send an email; something with a server has to. So the
 * page posts a two-line fact to whatever endpoint notify.json names, and that
 * endpoint is what turns it into mail - a form service, a webhook, or the
 * relay Worker, whichever is set. No endpoint, no ping, no error.
 *
 * What is sent is deliberately thin: which event, when, and where the link was
 * followed from. No profile, no chat text, no fingerprint, nothing typed into
 * the page. The endpoint sees an IP because every HTTP request has one; the
 * page adds nothing to that.
 *
 * Once per browsing session per event, so an open tab does not become a
 * mailing list. It is best-effort throughout: a blocked or missing endpoint is
 * silent, because a page that breaks when its analytics break is worse than a
 * page nobody is watching. */

let notifyUrl = null;                        // null until notify.json is read

async function findNotify() {
  try {
    const res = await fetch("notify.json", { cache: "no-store" });
    if (!res.ok) return "";
    const j = await res.json();
    const url = (j && typeof j.url === "string") ? j.url.trim() : "";
    return /^https:\/\//.test(url) ? url : "";
  } catch { return ""; }
}

async function ping(event) {
  try {
    const once = "muster:pinged:" + event;
    if (sessionStorage.getItem(once)) return;
    sessionStorage.setItem(once, "1");
    if (notifyUrl === null) notifyUrl = await findNotify();
    if (!notifyUrl) return;
    await fetch(notifyUrl, {
      method: "POST",
      headers: { "content-type": "application/json" },
      // keepalive so a ping fired as the tab closes still leaves.
      keepalive: true,
      body: JSON.stringify({
        event,
        subject: event === "visit" ? "Someone opened Muster"
               : event === "chat"  ? "Someone used the Muster assistant"
               :                     "Muster: " + event,
        at: new Date().toISOString(),
        from: document.referrer || "(typed or bookmarked)",
        page: location.href
      })
    });
  } catch { /* never let this break the page */ }
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("muster:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("muster:" + k, JSON.stringify(v)); return true; } catch { return false; } }
};

let profile = store.get("profile", {});
let apps = store.get("apps", []);
let sample = null, mode = "checking", turns = [], ctl = null, route = "none";

/* How the assistant reaches Claude. Three routes, best first:
 *   claude — this page opened inside claude.ai, where Claude is already present.
 *   relay  — a URL you point at your own backend; visitors need no key at all.
 *            This is the route that turns Muster into something you can charge for.
 *   key    — the visitor's own Anthropic key, held in this browser and sent
 *            straight to api.anthropic.com. It never passes through Muster,
 *            because Muster has no server to pass it through.
 * Nothing here is a password and nothing is shared. */
/* Where the chat gets answered. One field, because there is one answer: a desk.
 *
 * This page used to offer three ways to connect an assistant and a screen to
 * choose between them. That screen was the product asking the person using it
 * to solve the product's problem. It is gone. The address arrives in the link
 * or in relay.json, and the chat either works or says it is offline. */
const ASSIST = { relay: store.get("relay", "") };

/* The hosted relay, if this deployment has one. Kept in a separate small file
 * rather than baked in here, so pointing Muster at a backend is a one-line
 * edit rather than a rebuild of this page. Absent, empty or unreachable is a
 * normal state: the page then asks the visitor for their own key instead. */
let hostedRelay = "";
async function findHostedRelay() {
  try {
    const res = await fetch("relay.json", { cache: "no-store" });
    if (!res.ok) return "";
    const j = await res.json();
    const url = (j && typeof j.url === "string") ? j.url.trim() : "";
    // https only, so the relay cannot be downgraded on the wire — with an
    // exemption for a relay running on this machine, which is how you develop
    // against one before it is deployed.
    return /^https:\/\//.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:|\/)/.test(url)
      ? url : "";
  } catch { return ""; }
}
/* An address handed over in the link itself: .../index.html#desk=https://x.trycloudflare.com
 *
 * This exists because the alternative was worse. A quick tunnel takes a new
 * hostname every run, and the way to keep the page in step was for the desk to
 * write the address into relay.json through the GitHub API - which needs a
 * token set up once before anything works at all. A link that carries its own
 * address needs nothing set up: the launcher prints one, and whoever gets it
 * is talking to that desk.
 *
 * Same https-only rule as relay.json, with the same exemption for a desk on
 * this machine. It is remembered, so a reload without the fragment still
 * works, and #desk= with nothing after it forgets. */
function deskFromLink() {
  const m = /[#&]desk=([^&]*)/.exec(location.hash || "");
  if (!m) return null;
  let url = "";
  try { url = decodeURIComponent(m[1]).trim(); } catch { url = m[1].trim(); }
  if (!url) return "";                                   // #desk= clears it
  return /^https:\/\//.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:|\/)/.test(url)
    ? url : null;                                        // anything else: ignore
}

/* Adopt whatever the link names, and say so. Shared by the boot and by
 * hashchange, because pasting a new link into a tab that is already open
 * changes only the fragment - the browser does not reload, so nothing would
 * see the new address if this only ran once at startup. */
function adoptDesk() {
  // The code travels with the address. Asking somebody to paste one into a
  // settings field is asking them to do the product's job; a link that carries
  // both is a link that just works.
  const c = /[#&]code=([^&]*)/.exec(location.hash || "");
  if (c) { try { store.set("code", decodeURIComponent(c[1]).trim()); } catch { /* leave it */ } }

  const linked = deskFromLink();
  if (linked === null) {
    if (c) history.replaceState(null, "", location.pathname + location.search);
    return false;                             // a code alone, or not a desk
  }
  ASSIST.relay = linked;
  store.set("relay", linked);
  linkedEver = false; linkMisses = 0;   // a new address proves itself from scratch
  // Take it out of the address bar. It has been read, and a link left lying in
  // the bar gets copied and pasted long after that desk has gone.
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}

addEventListener("hashchange", async () => {
  if (!adoptDesk()) return;
  applyRoute(await detectRoute());
});

/* ---------- a desk on this machine ----------
 *
 * Offline is a bug, not a state to explain. On the computer that runs the desk
 * there is nothing to look up: it answers at a fixed local address that never
 * changes, so the page can simply go and find it. No tunnel, no link to carry,
 * no address to publish, nothing to restart.
 *
 * An https page is allowed to reach 127.0.0.1 - localhost counts as a
 * trustworthy origin - provided the server opts in with
 * Access-Control-Allow-Private-Network, which the desk already sends.
 *
 * Both are probed at once and given a short deadline, because a visitor with
 * no desk of their own must not wait on it. */
let localDesk = "";
let localMisses = 0;                 // consecutive probes that found nothing
const LOCAL_PORTS = [8770, 8771];
const LOCAL_GIVE_UP = 2;             // how many in a row before believing it

/* Chrome 138 and later will not let a public page open a connection to
 * 127.0.0.1 until the person at the keyboard says it may. What it does while
 * it waits is the part that matters here: it holds the request. Silently, with
 * no error and no timeout of its own.
 *
 * Measured on Chromium 141, from an https page:
 *   nothing listening  ->  refused in about 4ms
 *   the desk listening ->  held, indefinitely, until the prompt is answered
 *
 * Read those two lines together and the old probe was exactly backwards. It
 * gave up after 900ms, which costs a visitor with no desk nothing at all -
 * they were already refused - and cancels the request in the one case where it
 * was about to work, before its owner could answer. Give up early and the
 * answer never arrives, so the page reports offline while the desk sits there
 * running.
 *
 * The deadline now governs the PAGE, not the request. We stop waiting so the
 * page can say something; the request is left running, and if it lands later -
 * a second later, or a minute later when somebody clicks Allow - the desk is
 * picked up then. Which is the promise this page already makes: leave the tab
 * open and it connects by itself. */
const held = new Set();   // ports whose request the browser has not answered yet

function tryLocal(port) {
  const base = "http://127.0.0.1:" + port;
  if (held.has(port)) return Promise.resolve("");   // one question at a time
  return new Promise((resolve) => {
    let waited = false;
    const t = setTimeout(() => { waited = true; held.add(port); resolve(""); }, 900);
    fetch(base + "/health", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        clearTimeout(t); held.delete(port);
        const url = j && j.ok ? base + "/bridge/chat" : "";
        if (waited) { if (url) adoptLate(url); }    // it landed after we gave up
        else resolve(url);
      })
      .catch(() => {
        clearTimeout(t); held.delete(port);
        if (!waited) resolve("");
      });
  });
}

/* A desk that answered after the page had stopped waiting for it. */
function adoptLate(url) {
  if (localDesk === url) return;
  const was = route;
  localDesk = url;
  localMisses = 0;
  applyRoute(sample ? "claude" : relayUrl() ? "relay" : "none");
  if (was === "none" && route === "relay") bubble("", "Assistant", "Connected. Ask away.");
}

/* A desk that has answered once is believed until it has failed to answer
 * twice running. A single missed probe is not evidence that it has gone: the
 * server keeps one connection per browser, so a health check sent while an
 * answer is still coming back queues behind it and gets abandoned at the
 * deadline. Dropping the desk on that one miss is what made a working page say
 * offline in the middle of a conversation. */
async function findLocalDesk() {
  const found = (await Promise.all(LOCAL_PORTS.map(tryLocal))).find(Boolean) || "";
  if (found) { localMisses = 0; return found; }
  if (!localDesk) return "";                       // never had one
  localMisses += 1;
  return localMisses < LOCAL_GIVE_UP ? localDesk : "";
}

/* ---------- an address we were handed once ----------
 *
 * The launcher writes the desk into the link and the page remembers it, so a
 * reload without the fragment still works. That is the useful half. The other
 * half is that a quick tunnel takes a new hostname every run and the old one
 * does not go quiet - it is handed to somebody else, and it answers. What it
 * answers is a refusal.
 *
 * So the page said ready, because it had an address, and every question came
 * back Unauthorized, because the address had become a stranger's. The desk on
 * this very machine was up the whole time and was never asked, because a
 * remembered address outranked it and nothing ever checked it was still real.
 *
 * Every desk answers /health on its own origin, ahead of every gate it has, so
 * one cheap GET settles it. */
function probeDesk(url) {
  return new Promise((resolve) => {
    let health;
    try { health = new URL("/health", url).href; } catch { return resolve(false); }
    const c = new AbortController();
    const t = setTimeout(() => { c.abort(); resolve(false); }, 2500);
    fetch(health, { signal: c.signal, cache: "no-store" })
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => { clearTimeout(t); resolve(!!(j && j.ok)); })
      .catch(() => { clearTimeout(t); resolve(false); });
  });
}

let linkedDesk = "";          // the remembered address, while it is answering
let linkMisses = 0;
let linkedEver = false;       // has this particular address ever answered us?
let linkedGone = false;       // we have one written down and it will not answer
const LINK_GIVE_UP = 2;

/* Same two-strikes rule the local desk gets, and for the same reason: one
 * missed probe is a busy server, not a dead one. With one difference - an
 * address that has never answered gets no benefit of the doubt. Two strikes
 * protects something that was working. It is not a licence to trust a
 * hostname purely because it is written down. */
async function findLinkedDesk() {
  if (!ASSIST.relay) { linkedEver = false; linkMisses = 0; linkedGone = false; return ""; }
  if (await probeDesk(ASSIST.relay)) {
    linkMisses = 0; linkedEver = true; linkedGone = false;
    return ASSIST.relay;
  }
  if (!linkedEver) { linkedGone = true; return ""; }
  linkMisses += 1;
  if (linkMisses < LINK_GIVE_UP) return ASSIST.relay;
  linkedGone = true;
  return "";
}

/* Only addresses that have answered. There was a fallback here to the
 * remembered one when nothing else was found, on the theory that a page with
 * one address left is better off trying it than going dark. It is not. Trying
 * it is how the chat came to say "ready" and then answer every question
 * "Unauthorized": the address had been handed to a stranger, the stranger
 * refused, and the page had promised an assistant on the strength of having a
 * string rather than having a desk.
 *
 * A hostname we have never heard from is not a route. Saying so is worth more
 * than a hopeful request to somebody else's server. */
const relayUrl = () => linkedDesk || hostedRelay || localDesk;

/* The chat lives in one place at a time. On the dashboard it sits at the top of
 * the panel as the main thing; everywhere else it goes back to being the pane
 * on the right. Moving the node keeps one log, one history, one composer. */
function stowChat() {
  const pane = $("#chatpane"), shell = $("#shell");
  if (pane && pane.parentElement !== shell) shell.append(pane);
}

function placeChat(inline, panel) {
  const pane = $("#chatpane"), shell = $("#shell");
  if (!pane) return;
  if (inline) {
    const ask = document.createElement("h2");
    ask.className = "askline";
    ask.textContent = "Ask about anything in your search";
    panel.append(ask, pane);
    pane.classList.add("inline");
    shell.classList.add("dash-chat");
    shell.classList.remove("chat-open");
  } else {
    pane.classList.remove("inline");
    shell.classList.remove("dash-chat");
  }
  // Landing on the page should mean landing in the box you are meant to type in.
  if (inline && !narrow()) { const i = $("#input"); if (!i.disabled) i.focus(); }
}

function go(p) {
  current = p; store.set("panel", p.id);
  $("#ptitle").textContent = p.title;
  $("#psub").textContent = p.sub;
  document.querySelectorAll(".navbtn").forEach(b => b.setAttribute("aria-current", String(b.dataset.id === p.id)));
  const nc = $("#navCount"); if (nc) nc.textContent = apps.length || "";
  const w = $("#panel");
  stowChat();              // before the clear below, or the chat goes with it
  w.innerHTML = "";
  placeChat(p.id === "dash", w);
  ({ dash: renderDash, profile: renderProfile, apps: renderApps,
     connect: renderConnect })[p.id](w);
  renderChips();
}

/* ---------- profile ---------- */
function renderProfile(w) {
  // resume upload first — it is the thing that matters most
  const rc = document.createElement("div"); rc.className = "card";
  rc.innerHTML = '<p class="eyebrow">Resume</p>';
  const drop = document.createElement("div");
  drop.className = "drop" + (profile.resumeFile ? " has" : "");
  drop.innerHTML = `<div class="big"></div><div class="sm"></div>`;
  const setDrop = () => {
    drop.className = "drop" + (profile.resumeFile ? " has" : "");
    drop.querySelector(".big").textContent = profile.resumeFile
      ? profile.resumeFile.name : "Choose your resume";
    drop.querySelector(".sm").textContent = profile.resumeFile
      ? `${Math.round((profile.resumeFile.size||0)/1024)} KB · click to replace`
      : "PDF or Word, under 5 MB";
  };
  setDrop();
  const fi = document.createElement("input");
  fi.type = "file"; fi.accept = ".pdf,.doc,.docx,application/pdf"; fi.hidden = true;
  drop.onclick = () => fi.click();
  fi.onchange = async () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    if (f.size > 5 * 1024 * 1024) { drop.querySelector(".sm").textContent = "Over 5 MB — most portals reject those."; return; }
    const data = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onerror = () => rej(new Error("Could not read that file."));
      r.onload = () => res(String(r.result).split(",")[1]);
      r.readAsDataURL(f);
    }).catch(() => null);
    if (!data) { drop.querySelector(".sm").textContent = "Could not read that file."; return; }
    profile.resumeFile = { name: f.name, mimeType: f.type || "application/pdf", size: f.size, data };
    if (!store.set("profile", profile)) {
      drop.querySelector(".sm").textContent = "Too large to store in this browser. Try a smaller PDF.";
      delete profile.resumeFile; return;
    }
    setDrop();
  };
  rc.append(drop, fi);
  const rh = document.createElement("p"); rh.className = "hint";
  rh.textContent = "Stored in this browser only. The extension needs the actual bytes to attach it — "
    + "a file path would be useless, because a web page is not allowed to read one.";
  rc.append(rh);
  w.append(rc);

  // the rest of the profile
  FIELDS.forEach(group => {
    const c = document.createElement("div"); c.className = "card";
    const eb = document.createElement("p"); eb.className = "eyebrow"; eb.textContent = group.g;
    c.append(eb);
    const grid = document.createElement("div"); grid.className = "fields";
    group.f.forEach(([k, label, type, hint]) => {
      const cell = document.createElement("div");
      const l = document.createElement("label"); l.className = "lbl"; l.textContent = label; l.htmlFor = k;
      const i = document.createElement("input");
      i.type = type || "text"; i.id = k; i.value = profile[k] || "";
      i.oninput = () => { profile[k] = i.value.trim(); store.set("profile", profile); };
      cell.append(l, i);
      if (hint) { const h = document.createElement("p"); h.className = "hint"; h.textContent = hint; cell.append(h); }
      grid.append(cell);
    });
    c.append(grid);
    w.append(c);
  });

  const cl = document.createElement("div"); cl.className = "card";
  const b = document.createElement("button"); b.className = "btn ghost small"; b.textContent = "Clear everything";
  b.onclick = () => {
    if (!confirm("Clear your whole profile, including the resume?")) return;
    profile = {}; store.set("profile", profile); go(current);
  };
  cl.append(b);
  w.append(cl);
}

/* ---------- applications ---------- */
function renderApps(w) {
  const add = document.createElement("div"); add.className = "card";
  add.innerHTML = '<p class="eyebrow">Log an application</p>';
  const grid = document.createElement("div"); grid.className = "fields";
  const mk = (id, ph) => {
    const i = document.createElement("input"); i.type = "text"; i.id = "n_" + id; i.placeholder = ph;
    const d = document.createElement("div"); d.append(i); return d;
  };
  grid.append(mk("company", "Company"), mk("role", "Role"));
  const sel = document.createElement("select"); sel.id = "n_status";
  ["sent","replied","interview","rejected"].forEach(s => {
    const o = document.createElement("option"); o.value = s; o.textContent = s; sel.append(o);
  });
  const sd = document.createElement("div"); sd.append(sel); grid.append(sd);
  add.append(grid);
  const ab = document.createElement("button"); ab.className = "btn small"; ab.textContent = "Add";
  ab.style.marginTop = "11px";
  ab.onclick = () => {
    const company = $("#n_company").value.trim(), role = $("#n_role").value.trim();
    if (!company) return;
    apps.unshift({ company, role, status: sel.value, date: new Date().toISOString().slice(0,10) });
    store.set("apps", apps); go(current);
  };
  add.append(ab);
  w.append(add);

  const wrap = document.createElement("div"); wrap.className = "tblwrap";
  if (!apps.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "Nothing logged yet.";
    wrap.append(e);
  } else {
    const t = document.createElement("table");
    t.innerHTML = "<tr><th>Company</th><th>Role</th><th>Status</th><th>Date</th><th></th></tr>";
    apps.forEach((a, idx) => {
      const tr = document.createElement("tr");
      const td = (txt) => { const d = document.createElement("td"); d.textContent = txt; return d; };
      tr.append(td(a.company), td(a.role || "—"));
      const st = document.createElement("td");
      const pill = document.createElement("span"); pill.className = "pill " + a.status; pill.textContent = a.status;
      st.append(pill); tr.append(st, td(a.date));
      const x = document.createElement("td");
      const xb = document.createElement("button"); xb.className = "btn ghost small"; xb.textContent = "Remove";
      xb.onclick = () => { apps.splice(idx,1); store.set("apps", apps); go(current); };
      x.append(xb); tr.append(x);
      t.append(tr);
    });
    wrap.append(t);
  }
  w.append(wrap);
}

function charter() {
  const known = KEYS.filter(k => profile[k]).map(k => `${k}: ${profile[k]}`).join("\n");
  return "You are the assistant inside Muster, a job-application workspace. You help one person get "
    + "applications out.\n\n"
    + "LENGTH. Answer in at most three short sentences. If asked to draft something, give only the "
    + "draft. No preamble, no summary of what you are about to do, no offer of further help, no "
    + "bulleted menu of options, no closing question. Longer is allowed only when explicitly asked "
    + "for a full letter or a list. When in doubt, stop sooner.\n\n"
    + "Ask at most one clarifying question, and only if you genuinely cannot proceed.\n\n"
    + "You cannot browse, open files, send email, or fill forms yourself — a browser extension does the "
    + "filling. If something needs doing out there, say plainly what to do, and draft the exact wording "
    + "where that helps.\n\n"
    + "Never invent facts about this person. If a detail is missing, write the sentence and mark the gap "
    + "in square brackets.\n\n"
    + "One standing rule about relocation: never frame them as someone who needs to relocate or wants "
    + "relocation support. Write it as availability that is already true — \"available on site in <city>\", "
    + "\"available to start immediately\". Framing it as a hurdle costs interviews.\n\n"
    + (known ? "What you already know about them:\n" + known : "Their profile is still empty.")
    + (profile.resumeFile ? `\nThey have a resume saved (${profile.resumeFile.name}), which you cannot read.` : "")
    + `\nApplications logged: ${apps.length}.`;
}

  blocked:"The browser could not reach the desk. An ad blocker or a strict network will do this.",
  upstream_error:"The connection dropped. Try again."
};
const FATAL = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"]);

function trim() {
  let bytes = new Blob([charter()]).size;
  const kept = [];
  for (let i = turns.length - 1; i >= 0; i--) {
    const b = sizeOf(turns[i].content);
    if (bytes + b > 46000) break;
    bytes += b; kept.unshift(turns[i]);
  }
  while (kept.length && kept[0].role === "assistant") kept.shift();
  return kept;
}

/* ---------- attachments ----------
 *
 * Text files are read straight. PDFs are read here rather than with a library:
 * the artifact runtime allows scripts from a CDN but blocks the runtime fetches
 * a PDF library makes for its worker, so pulling one in would half-work. The
 * browser can already inflate a stream, which is the only hard part.
 *
 * This reads text-based PDFs - anything exported from Word, Pages, Google Docs
 * or LaTeX. It will not read a scan, and it will not read a PDF whose fonts
 * encode text as glyph ids. When it comes back with too little to be a
 * document it says so and asks for the text instead, rather than sending a
 * page of noise to the model as though it were a resume. */

const MAX_ATTACH = 4;
const MAX_TEXT = 60000;
let attached = [];

async function inflate(bytes, how) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(how));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

/* One stream's worth of bytes as text. Almost every PDF uses FlateDecode with
 * a zlib header; a few write it raw; a few leave it uncompressed. Try each. */
async function stream(bytes) {
  for (const how of ["deflate", "deflate-raw"]) {
    try { return latin(await inflate(bytes, how)); } catch { /* next */ }
  }
  return latin(bytes);
}

const latin = (b) => new TextDecoder("latin1").decode(b);

/* PDF string literals: escapes, octal, and a backslash before a newline is a
 * line continuation rather than a character. */
function unescapePdf(raw) {
  let out = "";
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c !== "\\") { out += c; continue; }
    const n = raw[++i];
    if (n === undefined) break;
    if (n >= "0" && n <= "7") {
      let oct = n;
      while (oct.length < 3 && raw[i + 1] >= "0" && raw[i + 1] <= "7") oct += raw[++i];
      out += String.fromCharCode(parseInt(oct, 8));
    } else if (n === "n") out += "\n";
    else if (n === "r") out += "\r";
    else if (n === "t") out += "\t";
    else if (n === "b" || n === "f") out += " ";
    else if (n === "\n" || n === "\r") { /* continuation: nothing */ }
    else out += n;
  }
  return out;
}

/* Walk the text-showing operators inside BT..ET and reassemble lines. */
function harvest(content) {
  const lines = [];
  for (const block of content.split(/\bBT\b/).slice(1)) {
    const body = block.split(/\bET\b/)[0];
    let line = "";
    // T* has no word boundary after the star, so it needs its own branch.
    const re = /\((?:\\[\s\S]|[^\\()])*\)|T\*|\bT[dDmJj]\b/g;
    let m;
    while ((m = re.exec(body))) {
      const tok = m[0];
      if (tok[0] === "(") line += unescapePdf(tok.slice(1, -1));
      else if (tok === "Td" || tok === "TD" || tok === "T*" || tok === "Tm") {
        if (line.trim()) { lines.push(line.trim()); line = ""; }
      }
    }
    if (line.trim()) lines.push(line.trim());
  }
  return lines.join("\n");
}

async function pdfText(buf) {
  const bytes = new Uint8Array(buf);
  const raw = latin(bytes);
  const chunks = [];
  // \b keeps this off the word "endstream", whose tail spells stream too.
  const re = /\bstream\r?\n/g;
  let m;
  while ((m = re.exec(raw))) {
    const from = m.index + m[0].length;
    const to = raw.indexOf("endstream", from);
    if (to < 0) break;
    // Most writers put an end-of-line between the data and the keyword, and a
    // decompressor treats that as junk after the stream, so cut it off.
    let end = to;
    while (end > from && (bytes[end - 1] === 10 || bytes[end - 1] === 13)) end--;
    chunks.push(await stream(bytes.subarray(from, end)));
    re.lastIndex = to + 9;
  }
  return harvest(chunks.join("\n")).replace(/[ \t]+/g, " ").trim();
}

async function readAttachment(file) {
  const name = file.name;
  const kb = Math.max(1, Math.round(file.size / 1024));
  if (file.size > 8 * 1024 * 1024) {
    return { name, kb, error: "over 8 MB" };
  }
  if (/^image\//.test(file.type)) {
    if (file.size > 3.5 * 1024 * 1024) return { name, kb, error: "image over 3.5 MB" };
    const data = await new Promise((res) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(",")[1]);
      r.onerror = () => res(null);
      r.readAsDataURL(file);
    });
    return data ? { name, kb, image: { type: file.type, data } }
                : { name, kb, error: "could not be read" };
  }
  if (/\.pdf$/i.test(name) || file.type === "application/pdf") {
    let text = "";
    try { text = await pdfText(await file.arrayBuffer()); } catch { text = ""; }
    if (text.length < 40) {
      return { name, kb, error: "no text in it — if it is a scan, paste the text instead" };
    }
    return { name, kb, text: text.slice(0, MAX_TEXT) };
  }
  const text = await file.text().catch(() => "");
  if (!text.trim()) return { name, kb, error: "empty" };
  return { name, kb, text: text.slice(0, MAX_TEXT) };
}

function renderFiles() {
  const box = $("#files");
  box.innerHTML = "";
  attached.forEach((a, i) => {
    const d = document.createElement("div");
    d.className = "file" + (a.error ? " bad" : "");
    const b = document.createElement("b"); b.textContent = a.name;
    const s = document.createElement("span");
    s.textContent = a.error ? a.error : (a.image ? "image" : `${a.kb} KB`);
    const x = document.createElement("button");
    x.textContent = "✕"; x.title = "Remove";
    x.onclick = () => { attached.splice(i, 1); renderFiles(); };
    d.append(b, s, x); box.append(d);
  });
}

/* The + button owns a hidden file input. Each file is read once, here, so a
 * failure shows on its chip instead of surfacing later as a bad answer. */
$("#clip").onclick = () => $("#pick").click();
$("#pick").addEventListener("change", async (e) => {
  const picked = [...e.target.files];
  e.target.value = "";                    // so the same file can be picked twice
  const clip = $("#clip");
  clip.disabled = true; clip.textContent = "\u2026";
  for (const f of picked) {
    if (attached.length >= MAX_ATTACH) {
      bubble("err", "Problem", `Four files at a time \u2014 ${f.name} was not added.`);
      break;
    }
    attached.push(await readAttachment(f));
    renderFiles();
  }
  clip.disabled = false; clip.textContent = "+";
  $("#input").focus();
});

/* A user turn is a plain string until something is attached; then it becomes
 * Messages-API content blocks, because that is the only way an image travels.
 * Routes that cannot carry blocks flatten them back to text. */
function blocksFor(text) {
  if (!attached.length) return text;
  const out = [];
  for (const a of attached) {
    if (a.error) continue;
    if (a.image) {
      out.push({ type: "image",
                 source: { type: "base64", media_type: a.image.type, data: a.image.data } });
    } else {
      const name = a.name.replace(/[<>"]/g, "");
      out.push({ type: "text",
                 text: `<file name="${name}">\n${a.text.replace(/<\/file>/g, "<\\/file>")}\n</file>` });
    }
  }
  if (!out.length) return text;
  out.push({ type: "text", text });
  return out;
}

function flatten(content) {
  if (typeof content === "string") return content;
  return content.map(b => b.type === "text" ? b.text
    : "[an image was attached; this route cannot carry pictures]").join("\n\n");
}

function flatTurns(msgs) {
  return msgs.map(m => ({ role: m.role, content: flatten(m.content) }));
}

function sizeOf(content) {
  if (typeof content === "string") return new Blob([content]).size;
  return content.reduce((n, b) => n +
    (b.type === "text" ? new Blob([b.text]).size : b.source.data.length * 0.75), 0);
}

/* ---------- talking to Claude ----------
 * One entry point, three routes. Each yields the same thing: a promise of the
 * finished text, calling onText with the whole answer so far as it arrives. */

/* Only the fields the extension fills, as trimmed strings. The resume itself
 * never goes — it stays here for the extension to attach. */
function relayProfile() {
  const out = {};
  for (const k of KEYS) {
    const v = profile[k];
    if (typeof v === "string" && v.trim()) out[k] = v.trim();
  }
  return out;
}

function mkErr(code, message) {
  return Object.assign(new Error(message || code), { code });
}

async function httpErr(res) {
  let detail = "";
  try { const j = await res.json(); detail = (j && j.error && j.error.message) || ""; } catch { /* not JSON */ }
  let code = "upstream_error";
  if (res.status === 403 && /access code/i.test(detail)) code = "bad_code";
  else if (res.status === 401 || res.status === 403) code = "refused";
  else if (res.status === 429) code = "rate_limited";
  else if (res.status === 400 || res.status === 422) code = "invalid_request";
  return mkErr(code, detail || res.statusText);
}

/* A refusal that came with a reason should show the reason. The desk knows
 * exactly why it said no - a missing code, an origin it has not been told to
 * serve - and repeating that beats a generic line every time. This page used
 * to answer a 403 with "that key was rejected, check console.anthropic.com",
 * which was wrong twice over: there is no key in this product, and it sent
 * whoever read it looking in the wrong place entirely. */
function refusalText(e) {
  const said = (e && e.message || "").trim();
  return said && said !== "Forbidden" ? said : ERRS.refused;
}

/* Anthropic streams server-sent events. We want the text deltas and nothing else. */
async function readSSE(res, onText) {
  if (!res.body) throw mkErr("upstream_error", "no response body");
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", out = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim();
      buf = buf.slice(nl + 1);
      if (!line.startsWith("data:")) continue;
      const raw = line.slice(5).trim();
      if (!raw || raw === "[DONE]") continue;
      let ev; try { ev = JSON.parse(raw); } catch { continue; }
      if (ev.type === "content_block_delta" && ev.delta && typeof ev.delta.text === "string") {
        out += ev.delta.text;
        if (onText) onText({ text: out, delta: ev.delta.text });
      } else if (ev.type === "error") {
        const m = (ev.error && ev.error.message) || "";
        throw mkErr(/rate/i.test(m) ? "rate_limited" : "upstream_error", m);
      }
    }
  }
  if (!out) throw mkErr("empty_completion");
  return out;
}

/* A relay — the hosted one, or your own. It may stream SSE in Anthropic's
 * shape, or simply answer with JSON ({text} or a Messages-API content array);
 * both are accepted so a backend can be the simplest thing that works.
 *
 * Note what is NOT sent: the system prompt. A relay that accepts one from the
 * page is an open Claude proxy on whoever's key it holds, so the relay writes
 * its own from these fields. */
async function askRelay(_sys, msgs, opts) {
  let res;
  try {
    res = await fetch(relayUrl(), {
      method: "POST", signal: opts.signal,
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        messages: flatTurns(msgs),
        profile: relayProfile(),
        hasResume: !!profile.resumeFile,
        appCount: apps.length,
        // The relay checks this. Stepping around the screen above gets you the
        // page; it does not get you an assistant.
        code: store.get("code", "")
      })
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw mkErr("cancelled");
    throw mkErr("blocked", String(e && e.message || e));
  }
  if (!res.ok) throw await httpErr(res);
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("event-stream")) return readSSE(res, opts.onText);
  const j = await res.json().catch(() => null);
  const text = j && (typeof j.text === "string" ? j.text
    : Array.isArray(j.content)
      ? j.content.filter(b => b && b.type === "text").map(b => b.text).join("")
      : "");
  if (!text) throw mkErr("empty_completion");
  if (opts.onText) opts.onText({ text, delta: text });
  return text;
}

async function ask(msgs, opts) {
  const sys = charter();
  if (route === "claude") {
    const r = await sample([{ role: "user", content: sys }, ...flatTurns(msgs)],
      { cache: false, signal: opts.signal, onText: opts.onText });
    return r.text;
  }
  if (route === "relay") return askRelay(sys, msgs, opts);
  throw mkErr("no_route");
}

async function send() {
  const box = $("#input"); const text = box.value.trim();
  if ((!text && !attached.length) || mode !== "live" || ctl) return;

  // Build the turn before clearing the tray, then clear it: a file goes with
  // the message it was attached to and does not ride along on the next one.
  const said = text || "Read the attached file.";
  const content = blocksFor(said);
  const names = attached.filter(a => !a.error).map(a => a.name);
  attached = []; renderFiles();

  box.value = ""; box.style.height = "auto";
  ping("chat");
  bubble("me","You", names.length ? said + "\n\u2014 " + names.join(", ") : said);
  turns.push({ role:"user", content });

  const holder = bubble("think","Assistant","Thinking…");
  ctl = new AbortController();
  const btn = $("#send"); btn.textContent = "Stop"; btn.onclick = () => ctl && ctl.abort();

  let streamed = false;
  try {
    const answer = await ask(trim(), {
      signal: ctl.signal,
      onText: ({ text }) => {
        if (!streamed) { streamed = true; holder.parentElement.className = "msg"; }
        holder.textContent = text; log.scrollTop = log.scrollHeight;
      } });
    turns.push({ role:"assistant", content:answer });
  } catch (e) {
    const code = (e && e.name === "AbortError") ? "cancelled"
               : (e && e.code) || "upstream_error";
    if (code === "cancelled") {
      if (e.text) { holder.textContent = e.text + "\n\n[stopped]"; holder.parentElement.className = "msg"; }
      else holder.parentElement.remove();
    } else {
      if (e && e.text) { holder.textContent = e.text; holder.parentElement.className = "msg"; }
      else holder.parentElement.remove();
      bubble("err","Problem",
        code === "refused" ? refusalText(e) : (ERRS[code] || ERRS.upstream_error));
      // A relay that stopped answering has usually moved rather than died.
      if (route === "relay" && (code === "blocked" || code === "upstream_error")) recheck();
      if (turns[turns.length-1] && turns[turns.length-1].role === "user") turns.pop();
      if (FATAL.has(code)) { mode = "preview"; setStatus("off","assistant unavailable"); lock(); }
    }
  } finally {
    ctl = null; const b = $("#send"); b.textContent = "Send"; b.onclick = send;
  }
}
/* Called when a route dies mid-session. Fall through to the next one that is
 * configured rather than going dark. */
function lock() {
  sample = null;
  applyRoute(relayUrl() ? "relay" : "none");
}

$("#send").onclick = send;
$("#input").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#input").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight,150) + "px"; });
$("#chatClear").onclick = () => { turns = []; log.innerHTML = ""; greet(); };
function greet() {
  bubble("","Assistant","Paste a job posting, or attach one with +. I can see your profile.");
}

function applyRoute(r) {
  route = r;
  const btn = $("#send"), input = $("#input");
  if (r === "none") {
    mode = "preview";
    input.disabled = true;
    btn.disabled = true;
    btn.textContent = "Send";
    input.placeholder = "Offline\u2026";
    setStatus("off", "offline");
    log.innerHTML = "";
    // Two sentences, because one was not enough. The first version said only
    // that it would come back on its own, which tells a visitor nothing about
    // why and tells the person who owns the desk nothing about what to do. The
    // fix for a chat box that is not answering should not be a card about API
    // keys, but it does have to name the thing that restores it.
    //
    // And there are two ways to be offline, which want different sentences. A
    // desk that is answering but that the browser is still holding a request to
    // is not a machine that is down - it is a permission nobody has been asked
    // to give yet, and telling that person to go and start a computer that is
    // already running is worse than saying nothing.
    bubble("", "Assistant", held.size
      ? "Your browser is asking whether this page may reach the desk on this "
        + "machine. Allow it \u2014 look for the local network prompt, or the icon at "
        + "the left of the address bar \u2014 and the chat opens by itself."
      : linkedGone
        // Worth its own sentence: nothing is broken here, the link is simply
        // out of date, and the person reading this can act on that.
        ? "The link that opened this page points at a desk that is no longer "
          + "answering. A tunnel takes a new address every time it starts, so an "
          + "old link stops working \u2014 ask whoever sent it for a fresh one. If it "
          + "is your own desk, start it and this connects by itself."
        : "Offline just now \u2014 the assistant runs on the owner's machine, and that "
          + "machine is not up. It connects by itself the moment it is; leave the tab open.");
    return;
  }
  mode = "live";
  setStatus("on", "ready");
  input.disabled = false;
  input.placeholder = "Ask, or paste a job posting…";
  btn.disabled = false;
  btn.textContent = "Send";
  btn.onclick = send;
}

/* The address the desktop publishes is not fixed: a quick tunnel hands out a
 * new one every time it is restarted. Rather than have anyone paste it
 * anywhere, the desktop writes it into relay.json beside this page and the
 * page keeps looking. Start the desktop and an open page connects by itself. */
async function recheck() {
  const [linked, found, local] = await Promise.all(
    [findLinkedDesk(), findHostedRelay(), findLocalDesk()]);
  if (linked === linkedDesk && found === hostedRelay && local === localDesk) return false;
  const was = route;
  linkedDesk = linked; hostedRelay = found; localDesk = local;
  applyRoute(sample ? "claude" : relayUrl() ? "relay" : "none");
  // Say it however it happened - on the timer, or because a dropped call sent
  // us looking. Somebody watching a dead page should see it come alive.
  if (was === "none" && route === "relay") bubble("", "Assistant", "Connected. Ask away.");
  return true;
}

let watching = null;
function watch() {
  // This used to stand down when a link had named a desk, on the grounds that
  // an address given on purpose should not be second-guessed. That is exactly
  // the page that cannot recover: the one address it has is the one that died.
  if (watching) return;
  watching = setInterval(() => {
    // Never probe while an answer is in flight. The check would queue behind
    // it, time out, and be read as the desk having gone.
    if (ctl) return;
    if (route === "none" || route === "relay") recheck();
  }, 20000);
}

async function detectRoute() {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch { sample = null; }
  if (sample) return "claude";
  // All three at once, and none of them on trust. Serially would mean a
  // visitor with no desk waits out every probe in turn before being told so.
  [linkedDesk, hostedRelay, localDesk] = await Promise.all(
    [findLinkedDesk(), findHostedRelay(), findLocalDesk()]);
  return relayUrl() ? "relay" : "none";
}

/* ---------- boot ---------- */
go(current); setStatus("", "connecting…"); greet();
(async () => {
  // A desk named in the link wins: someone handed that link over on purpose,
  // and it is newer than anything remembered here.
  adoptDesk();
  applyRoute(await detectRoute());
  watch();
  ping("visit");
})();
</script>
</body>
</html>
